<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay | AI Recovery Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        rzp: {
                            base: '#02040A',      // Ultra deep space
                            surface: '#0A0F1C',
                            primary: '#3B82F6',   // Razorpay Blue
                            accent: '#F59E0B',    // Amber/Gold
                            success: '#10B981',
                            danger: '#EF4444',
                        }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'blob-reverse': 'blob-reverse 12s infinite',
                        'spin-slow': 'spin 8s linear infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }
                        },
                        'blob-reverse': {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(-30px, 50px) scale(1.1)' },
                            '66%': { transform: 'translate(20px, -20px) scale(0.9)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'brightness(1)' },
                            '50%': { opacity: .6, filter: 'brightness(1.5)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #02040A;
            color: #F8FAFC;
            margin: 0;
            overflow-x: hidden;
            perspective: 1000px; /* For 3D Tilt */
        }

        /* Fluid Mesh Gradient Background */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(2, 4, 10, 1) 40%, rgba(2, 4, 10, 0.8) 100%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 50px);
            z-index: 0;
            pointer-events: none;
        }

        /* Cursor Spotlight */
        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(59,130,246,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: opacity 0.3s;
            mix-blend-mode: screen;
        }

        /* 3D Tilt Card Base */
        .tilt-card {
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            will-change: transform;
        }

        .tilt-card-inner {
            transform: translateZ(30px); /* Pops content out */
        }

        /* Ultra Premium Glass */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 20px 40px -10px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        
        /* Shimmer Effect on cards */
        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        .tilt-card:hover .glass-panel::after {
            left: 150%;
            transition: 1s ease-in-out;
        }

        .glass-input {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #fff;
        }
        
        .glass-input:focus {
            border-color: #F59E0B;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.2), inset 0 0 10px rgba(245, 158, 11, 0.1);
            outline: none;
            background: rgba(0,0,0,0.6);
        }

        /* SVG Rings */
        .progress-ring__circle {
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Scramble Text Class */
        .scramble-text {
            font-variant-numeric: tabular-nums;
        }

        /* Animated Gradient Text */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #60A5FA, #93C5FD, #F59E0B);
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Staggered load */
        .stagger-in { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-d-1 { animation-delay: 0.1s; }
        .stagger-d-2 { animation-delay: 0.2s; }
        .stagger-d-3 { animation-delay: 0.3s; }
        .stagger-d-4 { animation-delay: 0.4s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative selection:bg-rzp-primary/40 selection:text-white">
    
    <!-- Fluid Mesh Background -->
    <div class="bg-mesh"></div>
    <div id="cursor-glow"></div>

    <!-- Animated Blob Gradients -->
    <div class="fixed top-[-10%] left-[-5%] w-[500px] h-[500px] rounded-full bg-rzp-primary/10 blur-[150px] animate-blob pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[600px] h-[600px] rounded-full bg-rzp-accent/10 blur-[150px] animate-blob-reverse pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="border-b border-white/5 bg-rzp-base/30 backdrop-blur-3xl sticky top-0 z-50 stagger-in stagger-d-1">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-5 cursor-pointer group/logo">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-rzp-primary via-blue-500 to-rzp-accent flex items-center justify-center shadow-[0_0_30px_rgba(59,130,246,0.3)] relative group overflow-hidden transition-transform group-hover/logo:scale-105">
                    <div class="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></div>
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-white leading-tight transition-colors group-hover/logo:text-rzp-primary">Razorpay <span class="text-gradient">Recovery Engine</span></h1>
                    <p class="text-sm text-slate-400 font-medium tracking-wide">Hyper-Interactive Agent Dashboard</p>
                </div>
            </a>
            <div class="flex items-center gap-3 px-5 py-2.5 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl shadow-lg cursor-pointer hover:bg-white/10 transition">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rzp-success opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-rzp-success shadow-[0_0_12px_#10B981]"></span>
                </span>
                <span class="text-xs text-white font-bold tracking-wider uppercase">System Live</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full grid grid-cols-1 lg:grid-cols-12 gap-10 z-10 relative">
        
        <!-- Left Column: Controls -->
        <div class="lg:col-span-4 space-y-8">
            
            <!-- Control Panel 3D Card -->
            <div class="tilt-card stagger-in stagger-d-2">
                <div class="glass-panel rounded-3xl p-8 tilt-card-inner">
                    <!-- Tech accent line -->
                    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-rzp-accent to-transparent opacity-80"></div>
                    
                    <h2 class="text-2xl font-bold text-white mb-8 flex items-center gap-4">
                        <div class="p-2.5 rounded-xl bg-rzp-accent/15 border border-rzp-accent/30 text-rzp-accent shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        </div>
                        Simulation Core
                    </h2>
                    
                    <form id="simulate-form" class="space-y-6">
                        <div class="group">
                            <label class="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest group-hover:text-rzp-accent transition-colors">Cart Value (₹)</label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xl">₹</span>
                                <input type="number" id="sim-amount" value="12500" class="glass-input w-full rounded-2xl pl-10 pr-5 py-4 text-white text-xl font-mono placeholder-slate-600 transition-all">
                            </div>
                        </div>
                        
                        <div class="group">
                            <label class="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest group-hover:text-rzp-primary transition-colors">Drop-Off Reason</label>
                            <div class="relative">
                                <select id="sim-reason" class="glass-input w-full rounded-2xl px-5 py-4 text-white text-lg font-medium appearance-none cursor-pointer transition-all">
                                    <option value="price_hesitation" class="bg-rzp-surface">Price Hesitation</option>
                                    <option value="upi_timeout" class="bg-rzp-surface">UPI Timeout</option>
                                    <option value="card_decline" class="bg-rzp-surface">Card Decline</option>
                                </select>
                                <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" id="sim-btn" class="w-full relative overflow-hidden bg-white text-black font-extrabold py-4 rounded-2xl transition-all duration-300 transform active:scale-[0.97] shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:shadow-[0_0_35px_rgba(255,255,255,0.4)] flex items-center justify-center gap-3 mt-4 group">
                            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/50 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                            <span class="text-lg relative z-10 tracking-wide">Inject Abandoned Cart</span>
                            <svg class="w-5 h-5 relative z-10 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </form>

                    <!-- Recovery Trigger Area -->
                    <div id="recovery-area" class="mt-8 pt-8 border-t border-white/10">
                        <div class="group mb-5">
                            <label class="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest group-hover:text-rzp-primary transition-colors">Target Order</label>
                            <div class="relative">
                                <select id="order-select" class="glass-input w-full rounded-2xl px-5 py-4 text-white text-lg font-medium appearance-none cursor-pointer transition-all">
                                    <option value="" disabled selected class="bg-rzp-surface">Select an abandoned order...</option>
                                </select>
                                <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>

                        <div class="group mb-5">
                            <label class="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest group-hover:text-rzp-accent transition-colors">Manual AI Instructions (Optional)</label>
                            <textarea id="manual-prompt" rows="2" placeholder="e.g. 'Offer a 15% discount because they are a VIP'" class="glass-input w-full rounded-2xl px-5 py-4 text-white text-sm font-medium transition-all resize-none"></textarea>
                        </div>
                        
                        <button id="recover-btn" class="w-full relative overflow-hidden bg-rzp-primary/10 border border-rzp-primary text-rzp-primary hover:text-white font-bold py-4 rounded-2xl transition-all duration-300 group hover:bg-rzp-primary hover:shadow-[0_0_30px_rgba(59,130,246,0.4)] disabled:opacity-50 disabled:cursor-not-allowed">
                            <div class="flex justify-center items-center gap-3 z-10 relative">
                                <svg class="w-6 h-6 animate-spin hidden" id="recover-spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <svg class="w-6 h-6" id="recover-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                <span id="recover-text" class="text-lg tracking-wide">Invoke AI Recovery</span>
                            </div>
                        </button>
                        
                        <div id="recover-status-container" class="mt-5 p-4 rounded-xl bg-black/60 border border-white/10 hidden backdrop-blur-xl">
                            <p id="recover-status" class="text-sm text-center text-slate-300"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Dashboard & Logs -->
        <div class="lg:col-span-8 flex flex-col gap-8">
            
            <!-- Metrics Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 stagger-in stagger-d-3">
                <!-- Revenue at Risk (3D Card) -->
                <div class="tilt-card">
                    <div class="glass-panel rounded-3xl p-8 tilt-card-inner flex items-center justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                <div class="p-2 bg-rzp-danger/15 rounded-xl text-rzp-danger shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </div>
                                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">Revenue at Risk</h3>
                            </div>
                            <div class="text-5xl font-extrabold text-white flex items-baseline gap-1 font-mono">
                                <span class="text-rzp-danger/80 text-4xl">₹</span><span id="metric-risk" class="scramble-text tracking-tighter">0</span>
                            </div>
                            <div class="mt-4 flex items-center gap-2 text-sm text-slate-500 font-medium">
                                <span id="metric-abandoned-count" class="text-slate-300 font-bold bg-white/10 px-2 py-0.5 rounded">0</span> Open Cases
                            </div>
                        </div>
                        <!-- Animated SVG Ring -->
                        <div class="relative w-24 h-24">
                            <svg class="w-full h-full" viewBox="0 0 100 100">
                                <circle class="text-white/10 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                                <circle id="ring-risk" class="text-rzp-danger stroke-current progress-ring__circle" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="180"></circle>
                            </svg>
                        </div>
                    </div>
                </div>
                
                <!-- Revenue Recovered (3D Card) -->
                <div class="tilt-card">
                    <div class="glass-panel rounded-3xl p-8 tilt-card-inner flex items-center justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                <div class="p-2 bg-rzp-success/15 rounded-xl text-rzp-success shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </div>
                                <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest">Revenue Recovered</h3>
                            </div>
                            <div class="text-5xl font-extrabold text-white flex items-baseline gap-1 font-mono">
                                <span class="text-rzp-success/80 text-4xl">₹</span><span id="metric-recovered" class="scramble-text tracking-tighter">0</span>
                            </div>
                            <div class="mt-4 flex items-center gap-2 text-sm text-slate-500 font-medium">
                                <span id="metric-recovered-count" class="text-slate-300 font-bold bg-white/10 px-2 py-0.5 rounded">0</span> Saves
                            </div>
                        </div>
                        <!-- Animated SVG Ring -->
                        <div class="relative w-24 h-24">
                            <svg class="w-full h-full" viewBox="0 0 100 100">
                                <circle class="text-white/10 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                                <circle id="ring-recovered" class="text-rzp-success stroke-current progress-ring__circle" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="80"></circle>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Terminal Audit Trail (3D Card) -->
            <div class="tilt-card flex-grow h-full stagger-in stagger-d-4">
                <div class="glass-panel rounded-3xl flex flex-col h-full min-h-[480px] tilt-card-inner">
                    <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/[0.02]">
                        <h2 class="text-xl font-bold text-white flex items-center gap-4 tracking-wide">
                            <div class="w-3 h-3 rounded-full bg-rzp-primary shadow-[0_0_15px_rgba(59,130,246,0.8)] animate-pulse-glow"></div>
                            Agent Telemetry Stream
                        </h2>
                        <div class="flex items-center gap-2 text-xs font-mono font-bold bg-black/50 text-rzp-primary px-4 py-2 rounded-xl border border-rzp-primary/20 shadow-[inset_0_0_10px_rgba(59,130,246,0.1)]">
                            <svg class="w-4 h-4 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            SYNCING SECURE LINK
                        </div>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto p-6 space-y-5" id="audit-log-container">
                        <!-- Logs injected via JS -->
                        <div class="flex flex-col items-center justify-center h-full text-slate-500 space-y-4">
                            <div class="w-14 h-14 rounded-full border-[3px] border-slate-800 border-t-rzp-primary animate-spin opacity-80"></div>
                            <p class="font-mono text-sm tracking-widest uppercase">Listening for events...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
